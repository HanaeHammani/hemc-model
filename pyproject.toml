[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hemc"
version = "0.1.0"
description = "Hierarchical Eye Movement Classification: EMCCF reproduction + EMCCF++ (CRF-Viterbi) + Stage 2 microsaccade/drift detection"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
